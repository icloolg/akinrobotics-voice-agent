<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AkınVoice</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<!--
  Browser client for the voice agent. No build step, no libraries.
    mic (AudioWorklet, resampled to 16 kHz int16) -> WebSocket /ws
    WebSocket -> answer audio (int16 PCM) -> Web Audio, played back to back
  The browser's echo cancellation removes the agent's own voice from the mic,
  which is what makes barge-in (talking over the answer) possible.
  Protocol: see app/main.py.
-->
<style>
  /* Visual language follows akinsoft.com.tr: Inter, near-black text, navy
     buttons, brand-blue headings, a soft blue/lilac backdrop and white cards.
     Without internet (Docker offline) the font falls back to the system font. */
  :root {
    --bg: #f5f5f7; --panel: #ffffff; --ink: #161618; --muted: #6e6e73; --line: #e5e7ec;
    --brand: #0d4f9c; --navy: #0b1f3a; --navy-ink: #ffffff; --bubble: #f2f4f8;
    --ok: #1f9d57; --warn: #d1372c; --shadow: 0 10px 30px rgba(11, 31, 58, .08);
    --glow-a: #dfe8ff; --glow-b: #efe6ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1420; --panel: #141d2b; --ink: #eef2f7; --muted: #94a0b2; --line: #263246;
      --brand: #6aa8ff; --navy: #e8eef8; --navy-ink: #0b1f3a; --bubble: #1c2738;
      --ok: #46c683; --warn: #f0776c; --shadow: 0 10px 30px rgba(0, 0, 0, .35);
      --glow-a: #14264a; --glow-b: #22183f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink); background: var(--bg);
    background-image: radial-gradient(60% 50% at 15% 0%, var(--glow-a), transparent 70%),
                      radial-gradient(50% 45% at 90% 10%, var(--glow-b), transparent 70%);
    font: 16px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }

  /* top bar */
  .topbar { background: color-mix(in srgb, var(--panel) 80%, transparent); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--line); }
  .topbar .inner { max-width: 860px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
  .brand img { width: 34px; height: 34px; display: block; }
  .brand b { font-size: 1.2rem; font-weight: 800; letter-spacing: -.01em; color: var(--brand); }
  .brand b span { color: var(--navy); }
  .settings { display: flex; gap: 8px; align-items: center; margin-left: auto; }
  select { font: inherit; font-size: .8rem; font-weight: 500; color: var(--ink); background: var(--panel);
           border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; cursor: pointer; }

  /* page */
  .app { width: 100%; max-width: 860px; margin: 0 auto; flex: 1; min-height: 0;
         display: flex; flex-direction: column; padding: 0 16px; }
  .hero { padding: 20px 0 0; display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .hero h1 { margin: 0; font-size: clamp(1.4rem, 3.5vw, 2rem); line-height: 1.15; font-weight: 800;
             letter-spacing: -.02em; color: var(--brand); }
  .hero p { margin: 4px 0 0; color: var(--muted); font-size: .92rem; }
  .status { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: .82rem; font-weight: 500;
            color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 99px;
            padding: 5px 12px; box-shadow: var(--shadow); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); flex: none; }
  .dot.listening { background: var(--ok); }
  .dot.hearing { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 30%, transparent); }
  .dot.thinking { background: var(--brand); animation: pulse 1s infinite; }
  .dot.speaking { background: var(--brand); }
  .dot.error { background: var(--warn); }
  @keyframes pulse { 50% { opacity: .35; } }

  #log {
    flex: 1; min-height: 200px; overflow-y: auto; background: var(--panel); border-radius: 20px;
    box-shadow: var(--shadow); border: 1px solid var(--line);
    padding: 18px; display: flex; flex-direction: column; gap: 10px;
  }
  .hint { color: var(--muted); margin: auto; text-align: center; max-width: 34em; position: relative; }
  /* Before the conversation starts: the AKINSOFT logo as a faint watermark. */
  #log { position: relative; scrollbar-width: thin; scrollbar-color: var(--brand) transparent; }
  #log::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-track { background: transparent; margin: 14px 0; }
  #log::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--brand) 70%, transparent); border-radius: 99px; }
  #log::-webkit-scrollbar-thumb:hover { background: var(--brand); }
  #log::-webkit-scrollbar-button { display: none; }
  #log:has(> #hint)::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .07;
    background: url("/static/brand/akinsoft-logo.webp") center / min(300px, 60%) no-repeat;
  }
  .hint b { color: var(--ink); font-weight: 600; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--navy); color: var(--navy-ink); border-bottom-right-radius: 4px; }
  .msg.agent { align-self: flex-start; background: var(--bubble); border-bottom-left-radius: 4px; }
  .msg.cut { opacity: .6; }
  .msg .lang { font-size: .68rem; font-weight: 600; opacity: .7; text-transform: uppercase; margin-right: 6px; }
  .meta { align-self: flex-start; color: var(--muted); font-size: .76rem; margin: -4px 0 4px 4px;
          font-variant-numeric: tabular-nums; }
  .meta b { color: var(--ink); font-weight: 600; }

  .controls { display: flex; align-items: center; gap: 14px; padding: 14px 0 16px; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 500; border-radius: 12px; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); padding: 11px 18px; cursor: pointer; transition: transform .1s, box-shadow .2s;
  }
  button:hover { box-shadow: var(--shadow); }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--navy); border-color: var(--navy); color: var(--navy-ink); font-weight: 600; min-width: 11em; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  label { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: .88rem; cursor: pointer; }
  .meter { flex: 1; min-width: 90px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .08s linear; }

  /* Robot strip: every robot with a picture, scrolling slowly; the ones in the
     last answer light up. The list is in the track twice, so moving the track
     by half its width loops without a jump. Hover pauses it. */
  .robots { overflow: hidden; padding: 20px 0 22px; margin: -6px 0 -8px; position: relative; z-index: 1; flex: none;
            mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }
  .track { display: flex; gap: 8px; width: max-content; animation: slide 28s linear infinite; }
  .robots:hover .track { animation-play-state: paused; }
  @keyframes slide { to { transform: translateX(calc(-50% - 4px)); } }
  @media (prefers-reduced-motion: reduce) { .track { animation: none; } .robots { overflow-x: auto; } }
  .robot { flex: none; width: 84px; text-align: center; font-size: .7rem; font-weight: 500; color: var(--muted);
           background: color-mix(in srgb, var(--panel) 70%, transparent); border: 1px solid var(--line);
           border-radius: 14px; padding: 6px 2px 4px; transition: all .25s; }
  .robot img { height: 60px; width: 100%; object-fit: contain; display: block; margin: 0 auto 2px; }
  .robot { position: relative; transform-origin: center; }
  .robot:hover { transform: scale(1.25); z-index: 1; border-color: var(--brand); color: var(--ink);
                 background: var(--panel); box-shadow: 0 8px 24px color-mix(in srgb, var(--brand) 22%, transparent); }
  .robot.active { border-color: var(--brand); color: var(--ink); background: var(--panel);
                  box-shadow: 0 4px 16px color-mix(in srgb, var(--brand) 25%, transparent); }
  /* Pictures of the robots an answer talks about, under that answer. */
  .pics { align-self: flex-start; display: flex; gap: 10px; flex-wrap: wrap; margin: -2px 0 2px 4px; }
  .pics figure { margin: 0; text-align: center; font-size: .72rem; color: var(--muted);
                 background: var(--bubble); border-radius: 14px; padding: 8px 10px 4px; }
  .pics img { height: 110px; display: block; margin: 0 auto 2px; }
  .pics.many img { height: 64px; }

  /* The assistant fills the first screen; the footer is below it, as on a website. */
  .screen { height: 100dvh; display: flex; flex-direction: column; }
  .toplinks { display: flex; gap: 4px; margin-left: 18px; }
  .toplinks a { color: var(--muted); font-size: .82rem; font-weight: 500; text-decoration: none;
                padding: 6px 10px; border-radius: 10px; }
  .toplinks a:hover { color: var(--ink); background: var(--bubble); }

  .site-footer { background: var(--panel); border-top: 1px solid var(--line); color: var(--muted); font-size: .84rem; }
  .site-footer .inner { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  .cols { display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: 28px; padding: 36px 0 28px; }
  .cols h4 { margin: 0 0 10px; color: var(--ink); font-size: .74rem; font-weight: 700;
             text-transform: uppercase; letter-spacing: .04em; }
  .cols ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
  .cols a { color: var(--muted); text-decoration: none; }
  .cols a:hover { color: var(--brand); }
  .about .brand { margin-bottom: 10px; }
  .about p { margin: 0; max-width: 30em; line-height: 1.6; }
  .bottom { border-top: 1px solid var(--line); padding: 16px 0 20px; display: flex; gap: 14px 24px;
            align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: .76rem; }
  .bottom p { margin: 0; line-height: 1.6; }
  .social { display: flex; gap: 18px; flex-wrap: wrap; }
  .social div { display: flex; align-items: center; gap: 6px; }
  .social span { font-size: .68rem; font-weight: 700; letter-spacing: .04em; color: var(--ink); margin-right: 2px; }
  .social a { width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 50%; display: grid;
              place-items: center; color: var(--ink); transition: all .2s; }
  .social a:hover { border-color: var(--brand); color: var(--brand); transform: translateY(-1px); }
  .social svg { width: 15px; height: 15px; }
  @media (max-width: 760px) {
    .cols { grid-template-columns: 1fr 1fr; } .about { grid-column: 1 / -1; } .toplinks { display: none; }
  }
  @media (max-width: 560px) {
    .hero { padding-top: 14px; } .status { margin-left: 0; }
    button.primary { min-width: 0; flex: 1; }
    .meter { flex-basis: 100%; }
  }
</style>

<body>
<div class="screen">
<div class="topbar">

      </div>

<script>
const MIC_RATE = 16000, BLOCK = 512;   // what the server expects: 32 ms blocks of 16 kHz int16

// Runs on the audio thread: averages the mic signal down to 16 kHz and posts int16 blocks.
const WORKLET = `
class Mic extends AudioWorkletProcessor {
  constructor() { super(); this.acc = 0; this.n = 0; this.pos = 0; this.out = new Int16Array(${BLOCK}); this.len = 0; }
  process(inputs) {
    const ch = inputs[0][0];
    if (!ch) return true;
    for (let i = 0; i < ch.length; i++) {
      this.acc += ch[i]; this.n++; this.pos += ${MIC_RATE};
      if (this.pos >= sampleRate) {
        this.pos -= sampleRate;
        const s = Math.max(-1, Math.min(1, this.acc / this.n));
        this.acc = 0; this.n = 0;
        this.out[this.len++] = s * 32767;
        if (this.len === ${BLOCK}) { this.port.postMessage(this.out.slice().buffer); this.len = 0; }
      }
    }
    return true;
  }
}
registerProcessor('mic', Mic);`;

const $ = id => document.getElementById(id);
const log = $('log');
let ws, ctx, micStream, micNode;
let outRate = 22050;
let playing = new Set(), nextTime = 0;   // scheduled answer audio
let answering = false;                   // between end_of_speech and done/empty
let agentMsg = null;

// ---------- robot pictures ----------
// Name patterns (Turkish and English answers) -> picture in /static/robots.
// (UV-C robot: no picture available on the website.)
const ROBOTS = [
  { name: 'Mini Ada',              file: 'mini-ada',              re: /mini\s*ada/i },
  { name: 'Ada-7',                 file: 'ada-7',                 re: /ada[\s-]?7/i },
  { name: 'Servis Robotu V3',      en: 'Service Robot V3',        file: 'servis-robotu-v3',      re: /servis robotu v3|service robot v3/i },
  { name: 'Fabrika Servis Robotu', en: 'Factory Service Robot',   file: 'fabrika-servis-robotu', re: /fabrika servis|factory service/i },
  { name: 'AMR',                   file: 'amr-robotu',            re: /\bAMR\b/ },
  { name: 'ARAT',                  file: 'arat',                  re: /\bARAT\b/i },
  { name: 'AKINCI-5',              file: 'akinci-5',              re: /ak[ıi]nc[ıi][\s-]?5/i },
];
const robotSrc = r => '/static/robots/' + r.file + '.webp';
const robotName = r => (uiLang === 'en' && r.en) || r.name;   // follows the interface language

function buildStrip() {
  for (const copy of [false, true]) {          // second copy: only for the seamless loop
    for (const r of ROBOTS) {
      const el = document.createElement('div');
      el.className = 'robot'; el.dataset.file = r.file;
      if (copy) el.setAttribute('aria-hidden', 'true');
      const img = new Image(); img.src = robotSrc(r);
      const label = document.createElement('span'); label.className = 'rname';
      el.append(img, label);
      $('robots').append(el);
    }
  }
}

// After an answer: picture(s) of the robots it mentions, and highlight them in the strip.
function showRobots(text) {
  const found = ROBOTS.filter(r => r.re.test(text));
  for (const el of document.querySelectorAll('.robot'))
    el.classList.toggle('active', found.some(r => r.file === el.dataset.file));
  if (!found.length) return;
  const box = add('pics' + (found.length > 2 ? ' many' : ''), '');
  for (const r of found) {
    const fig = document.createElement('figure');
    const img = new Image(); img.src = robotSrc(r); img.alt = robotName(r);
    img.onload = () => { log.scrollTop = log.scrollHeight; };
    fig.append(img, robotName(r));
    box.append(fig);
  }
}

// ---------- footer: social links (from the footers of akinrobotics.com and akinsoft.com.tr) ----------
const ICONS = {
  Facebook: '<path fill="currentColor" d="M13.5 21v-7.5h2.6l.4-3h-3V8.6c0-.9.3-1.5 1.5-1.5h1.6V4.4c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.2H8v3h2.4V21z"/>',
  X: '<path fill="currentColor" d="M17.8 3h3l-6.6 7.6L22 21h-6.1l-4.8-6.3L5.6 21h-3l7.1-8.1L2.2 3h6.2l4.4 5.8zm-1.1 16.2h1.7L7.4 4.7H5.6z"/>',
  LinkedIn: '<path fill="currentColor" d="M4 9h3.3v11H4zm1.7-5.5a1.9 1.9 0 1 1 0 3.8 1.9 1.9 0 0 1 0-3.8zM9.4 9h3.2v1.5c.5-.9 1.6-1.8 3.3-1.8 3.4 0 4.1 2.2 4.1 5.2V20h-3.3v-5.4c0-1.3 0-2.9-1.8-2.9s-2.1 1.4-2.1 2.8V20H9.4z"/>',
  Instagram: '<g fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/></g><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"/>',
  YouTube: '<path fill="currentColor" d="M21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4A2.5 2.5 0 0 0 2.4 7.2C2 8.8 2 12 2 12s0 3.2.4 4.8a2.5 2.5 0 0 0 1.8 1.8C5.8 19 12 19 12 19s6.2 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8c.4-1.6.4-4.8.4-4.8s0-3.2-.4-4.8zM10 15V9l5.2 3z"/>',
};
const SOCIAL = {
  AKINROBOTICS: { Facebook: 'https://www.facebook.com/akinrobotics', X: 'https://x.com/akinrobotics',
                  LinkedIn: 'https://www.linkedin.com/in/akinrobotics', Instagram: 'https://www.instagram.com/akinrobotics',
                  YouTube: 'https://www.youtube.com/akinrobotics' },
  AKINSOFT:     { Facebook: 'https://www.facebook.com/akinsoft', X: 'https://x.com/akinsoftyazilim',
                  LinkedIn: 'https://www.linkedin.com/company/akinsoftyazilim', Instagram: 'https://www.instagram.com/akinsoft',
                  YouTube: 'https://www.youtube.com/akinsoft' },
};
function buildSocial() {
  for (const [company, links] of Object.entries(SOCIAL)) {
    const group = document.createElement('div');
    const label = document.createElement('span'); label.textContent = company;
    group.append(label);
    for (const [network, url] of Object.entries(links)) {
      const a = document.createElement('a');
      a.href = url; a.target = '_blank'; a.rel = 'noopener';
      a.title = `${company} ${network}`; a.setAttribute('aria-label', a.title);
      a.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[network]}</svg>`;
      group.append(a);
    }
    $('social').append(group);
  }
}

// ---------- interface language ----------
// UI texts in both languages. The speech language (what the user speaks) is a
// separate choice below: someone can read the page in Turkish and ask in English.
const YEAR = new Date().getFullYear();
const TEXT = {
  tr: {

const store = {   // remembered choices; storage can be blocked (private window), so never fail on it
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let uiLang = store.get('akinvoice.ui', navigator.language?.startsWith('tr') === false ? 'en' : 'tr');
if (!TEXT[uiLang]) uiLang = 'tr';
let statusKey = 'notConnected', statusExtra = '';
const t = key => TEXT[uiLang][key] ?? key;

function applyLanguage() {
  document.documentElement.lang = uiLang;
  for (const el of document.querySelectorAll('[data-i18n]')) {
    const v = t(el.dataset.i18n);
    if (v.includes('<')) el.innerHTML = v; else el.textContent = v;
  }
  for (const el of document.querySelectorAll('[data-i18n-html]')) el.innerHTML = t(el.dataset.i18nHtml);
  for (const el of document.querySelectorAll('[data-i18n-title]')) el.title = t(el.dataset.i18nTitle);
  for (const el of document.querySelectorAll('.robot')) {
    const r = ROBOTS.find(r => r.file === el.dataset.file);
    el.querySelector('.rname').textContent = robotName(r);
    if (!el.hasAttribute('aria-hidden')) el.querySelector('img').alt = robotName(r);
  }
  $('status').textContent = t(statusKey) + (statusExtra ? ' ' + statusExtra : '');
}

// The status is stored as a key, so switching the interface language re-translates it.
function setStatus(kind, key, extra = '') {
  $('dot').className = 'dot ' + kind; statusKey = key; statusExtra = extra;
  $('status').textContent = t(key) + (extra ? ' ' + extra : '');
}

// Speech language: 'auto' lets Whisper detect it; tr/en skip detection
// (short English questions were otherwise heard as Turkish).
function sendSpeechLanguage() {
  const v = $('speechLang').value;
  if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'language', value: v === 'auto' ? null : v }));
}

function add(cls, text) {
  $('hint')?.remove();
  const el = document.createElement('div');
  el.className = cls; el.textContent = text;
  log.append(el); log.scrollTop = log.scrollHeight;
  return el;
}

// ---------- playback ----------
function play(buffer) {
  const pcm = new Int16Array(buffer);
  if (!pcm.length) return;
  const audio = ctx.createBuffer(1, pcm.length, outRate);
  const data = audio.getChannelData(0);
  for (let i = 0; i < pcm.length; i++) data[i] = pcm[i] / 32768;
  const src = ctx.createBufferSource();
  src.buffer = audio; src.connect(ctx.destination);
  nextTime = Math.max(nextTime, ctx.currentTime + 0.03);
  src.start(nextTime); nextTime += audio.duration;
  playing.add(src);
  src.onended = () => { playing.delete(src); if (!playing.size && !answering && ws) setStatus('listening', 'listening'); };
  setStatus('speaking', 'speaking');
}
function stopPlayback() {
  const was = playing.size > 0;
  for (const src of playing) { src.onended = null; try { src.stop(); } catch {} }
  playing.clear(); nextTime = 0;
  return was;
}
const isPlaying = () => playing.size > 0;

// ---------- server events ----------
function onEvent(e) {
  switch (e.type) {
    case 'hello':
      outRate = e.sample_rate;
      if (e.barge_in === false) { $('bargein').checked = false; $('bargein').disabled = true; }
      setStatus('listening', 'listening');
      break;
    case 'speech_start':                 // the server heard the user: be quiet
      if ((stopPlayback() || answering) && agentMsg) agentMsg.classList.add('cut');
      answering = false; agentMsg = null;
      setStatus('hearing', 'hearing');
      break;
    case 'end_of_speech':
      answering = true; agentMsg = null;
      setStatus('thinking', 'thinking');
      break;
    case 'transcript': {
      const el = add('msg user', e.text);
      const lang = document.createElement('span');
      lang.className = 'lang'; lang.textContent = e.language; el.prepend(lang);
      break;
    }
    case 'sentence':
      if (!agentMsg) agentMsg = add('msg agent', '');
      agentMsg.textContent += (agentMsg.textContent ? ' ' : '') + e.text;
      log.scrollTop = log.scrollHeight;
      break;
    case 'done': {
      answering = false;
      if (agentMsg) showRobots(agentMsg.textContent);
      const m = e.metrics, ms = m.ms, sec = v => (v / 1000).toFixed(1) + ' ' + t('sec');
      const el = add('meta', '');
      const total = document.createElement('b');
      total.textContent = t('latency') + ' ' + sec(m.response_ms ?? ms.first_audio);
      el.append(total, ` · STT ${sec(ms.stt_done)} · ${t('firstToken')} ${sec(ms.llm_first_token - ms.stt_done)}`
        + ` · ${t('firstSentence')} ${sec(ms.first_audio - ms.llm_first_token)}`
        + ` · ${t('source')}: ${m.sources.length ? m.sources.join(', ') : (m.route === 'chitchat' ? t('smalltalk') : t('none'))}`);
      if (!isPlaying()) setStatus('listening', 'listening');
      break;
    }
    case 'empty':
      answering = false;
      if (!isPlaying()) setStatus('listening', 'listening');
      break;
  }
}

// ---------- start / stop ----------
async function start() {
  if (!navigator.mediaDevices?.getUserMedia) {
    setStatus('error', 'needHttps');
    return;
  }
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
  } catch (err) {
    setStatus('error', 'micDenied', err.message);
    return;
  }
  ctx = new AudioContext();
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: 'application/javascript' })));
  micNode = new AudioWorkletNode(ctx, 'mic');
  ctx.createMediaStreamSource(micStream).connect(micNode);

  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.binaryType = 'arraybuffer';
  ws.onopen = sendSpeechLanguage;
  setStatus('thinking', 'connecting');
  ws.onmessage = ev => typeof ev.data === 'string' ? onEvent(JSON.parse(ev.data)) : play(ev.data);
  ws.onclose = () => { if (ws) { stop(); setStatus('error', 'disconnected'); } };

  micNode.port.onmessage = ev => {
    const pcm = new Int16Array(ev.data);
    let sum = 0;
    for (let i = 0; i < pcm.length; i++) sum += pcm[i] * pcm[i];
    $('level').style.width = Math.min(100, Math.sqrt(sum / pcm.length) / 32768 * 400) + '%';
    // Without barge-in the mic is not sent while the agent thinks or talks (half-duplex).
    const hold = !$('bargein').checked && (answering || isPlaying());
    if (ws?.readyState === WebSocket.OPEN && !hold) ws.send(ev.data);
  };
  $('toggle').dataset.i18n = 'stop'; applyLanguage();
}

function stop() {
  const socket = ws; ws = null;
  socket?.close();
  stopPlayback();
  micStream?.getTracks().forEach(t => t.stop());
  ctx?.close();
  ctx = micStream = micNode = null; answering = false; agentMsg = null;
  $('level').style.width = '0';
  $('toggle').dataset.i18n = 'start'; applyLanguage();
  setStatus('', 'notConnected');
}

buildStrip();
buildSocial();
$('uiLang').value = uiLang;
$('speechLang').value = store.get('akinvoice.speech', 'auto');
applyLanguage();
$('uiLang').onchange = () => { uiLang = $('uiLang').value; store.set('akinvoice.ui', uiLang); applyLanguage(); };
$('speechLang').onchange = () => { store.set('akinvoice.speech', $('speechLang').value); sendSpeechLanguage(); };
$('toggle').onclick = () => ws ? stop() : start();
$('reset').onclick = () => {
  if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'reset' }));
  stopPlayback(); answering = false; agentMsg = null;
  log.replaceChildren();
};
</script>
