# GPU additions, used together with docker-compose.yml:
#
#     docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
#
# Gives the NVIDIA GPU to the LLM (Ollama) and to Whisper.

services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  agent:
    build:
      args:
        GPU: "1"            # installs the CUDA libraries for Whisper (requirements-gpu.txt)
    environment:
      STT_DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
